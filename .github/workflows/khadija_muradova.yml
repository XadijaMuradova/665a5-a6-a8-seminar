name: Math Proof Checker CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  Build_Test:
    name: "CI — Theorem Proof Validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sympy

      - name: Check proof file exists
        run: |
          if [ ! -f proof.txt ]; then
            echo "[FAIL] proof.txt tapılmadı!"
            exit 1
          fi
          echo "[OK] proof.txt mövcuddur"

      - name: Validate proof structure
        run: python check_proof.py --mode=structure

      - name: Validate proof mathematics
        run: python check_proof.py --mode=math

      - name: Generate CI validation report
        run: python check_proof.py --mode=report

      - name: Upload CI validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-validation
          path: reports/
          retention-days: 7

  Build_Deploy:
    name: "CD — Report Generation & Deploy Simulation"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sympy

      - name: Create dist folder
        run: mkdir -p dist

      - name: Run full proof validation
        run: python check_proof.py --mode=full

      - name: Generate proof report
        run: python generate_report.py

      - name: Create release manifest
        run: |
          python - <<'EOF'
          import json, datetime, os

          manifest = {
              "project"    : "math-theorem-proof",
              "version"    : "1.0.${{ github.run_number }}",
              "commit"     : "${{ github.sha }}"[:7],
              "timestamp"  : datetime.datetime.utcnow().isoformat() + "Z",
              "theorem"    : "Sum of two even numbers is even",
              "method"     : "Direct proof",
              "status"     : "VERIFIED",
              "artifacts"  : ["dist/report.txt", "dist/report.pdf"]
          }

          with open("dist/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("[OK] Release manifest yaradıldı")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Show dist contents
        run: ls -lh dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-proof-report-v${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: Deployment simulation log
        run: |
          echo " DEPLOYMENT SIMULATION — SUCCESS "
          echo "  Project   : math-theorem-proof"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Artifacts : dist/"
          echo "  Status    : DEPLOYED (simulation) ✓"
          echo "  Note      : No real server — academic pipeline"
